<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="25%" stop-color="#E6CA85" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="75%" stop-color="#9A7B38" />
      <stop offset="100%" stop-color="#E6CA85" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FFF5DF" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: Interlocked Dual Celestial Rings with Diamond Crest -->
  <g transform="translate(15, 8)">
    <!-- Outer Decorative Radiance -->
    <circle cx="52" cy="52" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
    
    <!-- First Interlocked Eternity Ring -->
    <ellipse cx="44" cy="52" rx="28" ry="34" transform="rotate(-20 44 52)" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#subtleGlow)" />
    
    <!-- Second Interlocked Eternity Ring -->
    <ellipse cx="60" cy="52" rx="28" ry="34" transform="rotate(20 60 52)" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#subtleGlow)" />
    
    <!-- Inner Fine Highlights -->
    <ellipse cx="44" cy="52" rx="23" ry="29" transform="rotate(-20 44 52)" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.4" />
    <ellipse cx="60" cy="52" rx="23" ry="29" transform="rotate(20 60 52)" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.4" />
    
    <!-- Solitaire Diamond Starburst on Ring Intersection -->
    <g transform="translate(52, 22)">
      <polygon points="0,-8 3,-2 8,0 3,2 0,8 -3,2 -8,0 -3,-2" fill="url(#goldShine)" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>

    <!-- Bottom Tiny Greek Laurel / Crown -->
    <path d="M40,84 C46,88 58,88 64,84" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="52" cy="88" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography: RINGS LUXURY -->
  <!-- Main Name -->
  <text x="135" y="60" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="600" letter-spacing="7" fill="url(#goldGrad)">
    RINGS LUXURY
  </text>
  
  <!-- Subtle High-Jewelry Descriptor -->
  <text x="138" y="85" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="400" letter-spacing="8" fill="#A8A296">
    HAUTE JOAILLERIE • ATELIER
  </text>

  <!-- Fine Divider Line -->
  <line x1="138" y1="94" x2="380" y2="94" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4" />
</svg>
